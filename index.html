<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectINc Departure Lounge · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/"}}</script>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div id="pins"></div>

<header class="topbar">
  <div class="brand"><img src="logo.png" alt="ProjectINc"><div><b data-t="title">Departure Lounge</b><span data-t="subtitle">Your next journey starts here</span></div></div>
  <div class="top-actions">
    <button class="chip" id="btnPass" hidden><span class="dot"></span><span id="passChip"></span></button>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en" class="on">EN</button><button data-lang="nl">NL</button></div>
  </div>
</header>

<nav class="zones" id="zones" aria-label="Zones"></nav>

<footer class="route" id="route" aria-label="Your route"></footer>

<aside class="panel" id="panel" aria-live="polite" hidden>
  <button class="close" id="panelClose" aria-label="Close">×</button>
  <div id="panelBody"></div>
</aside>

<div class="overlay" id="onboard" hidden><div class="sheet" id="onboardBody"></div></div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast" role="status"></div>
<div class="loading" id="loading"><div class="plane">✈</div><p data-t="loading">Preparing the lounge…</p></div>

<script type="module" src="app.js"></script>
</body>
</html>
